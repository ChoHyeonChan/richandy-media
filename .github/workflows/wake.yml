# 다른 저장소의 게시 워크플로를 깨운다. 그 저장소에서는 GitHub 예약이 스스로 돌지 않아서 여기서 대신 부른다.
# 부를 저장소 이름과 토큰은 Secrets 에 둔다(WAKE_TARGET, WAKE_TOKEN). 로그에 찍지 않는다.
# 토큰은 그 저장소 하나의 Actions 읽기·쓰기 권한만 가진다.
name: wake

on:
  schedule:
    # 시각은 UTC 다. 예약 실행은 늦거나 빠질 수 있어서 한 시간마다 부른다.
    - cron: "12 23,0-5 * * *"  # 한국 08:12 ~ 14:12, 매시 12분
    - cron: "32 6-15 * * *"    # 한국 15:32 ~ 00:32, 매시 32분
  workflow_dispatch:

# 이 저장소에는 아무 권한도 필요 없다
permissions: {}

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ secrets.WAKE_TOKEN }}
      TARGET: ${{ secrets.WAKE_TARGET }}
    steps:
      - name: 깨우기
        run: |
          if [ -z "$GH_TOKEN" ] || [ -z "$TARGET" ]; then
            echo "::notice::WAKE_TOKEN 이나 WAKE_TARGET 이 아직 없다. 아무것도 하지 않았다."
            exit 0
          fi
          # 최근 40분 안에 이미 돌았으면(그쪽 예약이 스스로 돌았으면) 다시 부르지 않는다
          last=$(gh run list --repo "$TARGET" --workflow post.yml --limit 1 --json createdAt --jq '.[0].createdAt // empty')
          if [ -n "$last" ] && [ $(( $(date -u +%s) - $(date -u -d "$last" +%s) )) -lt 2400 ]; then
            echo "최근에 이미 돌았다. 부르지 않는다."
            exit 0
          fi
          gh workflow run post.yml --repo "$TARGET" --ref main
